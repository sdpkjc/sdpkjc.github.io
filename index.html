            line-height: 1.7;
            -webkit-font-smoothing: antialiased;

        main {
            width: min(1080px, calc(100% - 80px));

        .company, .university { transition: font-variation-settings 240ms ease; }
        .company:focus-visible, .university:focus-visible {

        .keep-together { white-space: nowrap; }
        .company { white-space: nowrap; }
        .company + .company { margin-left: 0.5em; }
        .contact { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px 4px; margin-top: 18px; }
        .contact a { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; }
        .contact svg { display: block; width: 20px; height: 20px; fill: currentColor; }
        .contact a[href^="mailto:"] svg { width: 22px; height: 22px; }
        .contact a[aria-label="GitHub"] svg { width: 18px; height: 18px; }
        .contact a[aria-label="Google Scholar"] svg { width: 22px; height: 22px; }
        .contact a[aria-label="X"] svg { width: 19px; height: 19px; }
        @media (hover: hover) and (pointer: fine) {
            .company:hover, .university:hover {
                font-variation-settings: "MONO" 1, "CASL" 0.5, "slnt" 0, "CRSV" 0;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .company, .university { transition: none; }
        }
        @media (max-width: 600px) {
            main { width: calc(100% - 32px); }
            .contact { column-gap: 0; }
        }
